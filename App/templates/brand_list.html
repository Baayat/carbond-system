{% extends 'base.html' %}

{% block content %}
    <h1>All Brands</h1>
    <a href="{% url 'add_brand_page' %}" class="btn btn-primary mb-3">Add New Brand</a>
    <ul class="list-group">
        {% for brand in brands %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ brand.brand_name }}
                <a href="{% url 'edit_brand_page' brand.id %}" class="btn btn-sm btn-warning">Edit</a>
            </li>
        {% empty %}
            <li class="list-group-item">No brands found.</li>
        {% endfor %}
    </ul>
{% endblock content %}
